# Nixpacks build config for Railway.
# When nixPkgs is specified it REPLACES auto-detected packages, so Python must
# be listed explicitly alongside texlive.
# texlive.combined.scheme-medium covers geometry, enumitem, hyperref, titlesec,
# parskip — all packages used by the Formal CV LaTeX template.

[phases.setup]
nixPkgs = ["python3", "texlive.combined.scheme-medium"]
